name: CI/CD Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # === Stage 1: Checkout Repository ===
      - name: Checkout repo
        uses: actions/checkout@v3

      # === Stage 2: Setup Node.js ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # === Stage 3: Install Dependencies & Build ===
      - name: Install & Build Next.js
        run: |
          npm ci
          npm run build
          tar -czf build.tar.gz .next public package.json next.config.mjs Dockerfile

      # === Stage 4: Setup SSH Agent ===
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # === Stage 5: Upload .env to VPS ===
      - name: Upload .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env
          scp -o StrictHostKeyChecking=no .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/surat-dapen-ppip-fe/.env

      # === Stage 6: Upload Build Artifact ===
      - name: Upload Build Artifact
        run: |
          scp -o StrictHostKeyChecking=no build.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/surat-dapen-ppip-fe/build.tar.gz

      # === Stage 7: Deploy on VPS ===
      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            PROJECT_DIR=/home/${USER}/surat-dapen-ppip-fe
            cd $PROJECT_DIR

            echo "🧹 Cleaning old container..."
            docker rm -f surat-dapen-ppip-fe || true

            echo "🧹 Cleaning old build..."
            rm -rf .next public package.json next.config.mjs Dockerfile || true

            echo "📦 Extracting new build..."
            tar -xzf build.tar.gz

            echo "🐳 Building new Docker image..."
            docker build -t surat-dapen-ppip-fe:latest .

            echo "🚀 Running new container..."
            docker run -d --name surat-dapen-ppip-fe \
              --env-file .env \
              -p 3000:3000 \
              --restart always \
              surat-dapen-ppip-fe:latest

            echo "✅ Deployment success!"
          EOF
