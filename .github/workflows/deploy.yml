name: CI/CD Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --- Stage 1: Checkout repository ---
      - name: Checkout repo
        uses: actions/checkout@v3

      # --- Stage 2: Setup Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --- Stage 3: Generate .env from secrets (ENV_FILE) ---
      - name: Create .env from Secrets
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env file created successfully"
        shell: bash

      # --- Stage 4: Install dependencies & Build ---
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # --- Stage 5: Archive build output ---
      - name: Archive build
        run: |
          tar -czf build.tar.gz .next package.json public .env next.config.* || echo "skip missing next.config"

      # --- Stage 6: Setup SSH Agent ---
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # --- Stage 7: Upload build to VPS ---
      - name: Upload build to VPS
        run: |
          scp -o StrictHostKeyChecking=no build.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/doaibub25/surat-dapen-ppip-fe/build.tar.gz

      # --- Stage 8: Deploy on VPS ---
      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            PROJECT_DIR=/home/doaibub25/surat-dapen-ppip-fe
            cd $PROJECT_DIR

            docker rm -f surat-dapen-ppip-fe || true
            rm -rf .next
            tar -xzf build.tar.gz

            docker build -t surat-dapen-ppip-fe:latest .
            docker run -d --name surat-dapen-ppip-fe \
              --env-file .env \
              -p 3000:3000 \
              --restart always \
              surat-dapen-ppip-fe:latest
          EOF
