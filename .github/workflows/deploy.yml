name: CI/CD Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --- Stage 1: Checkout source ---
      - name: Checkout repo
        uses: actions/checkout@v3

      # --- Stage 2: Setup Node.js ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # --- Stage 3: Install deps & Build ---
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # --- Stage 4: Compress build result ---
      - name: Archive build files
        run: |
          tar -czf build.tar.gz .next package.json next.config.js public

      # --- Stage 5: Setup SSH ---
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # --- Stage 6: Upload to server ---
      - name: Upload build to VPS
        run: |
          scp -o StrictHostKeyChecking=no build.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/doaibub25/surat-dapen-ppip-fe/

      # --- Stage 7: Deploy on server ---
      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            PROJECT_DIR=/home/doaibub25/surat-dapen-ppip-fe
            cd $PROJECT_DIR

            # Extract build result
            tar -xzf build.tar.gz
            rm -f build.tar.gz

            # Restart docker container / pm2
            docker rm -f surat-dapen-ppip-fe || true
            docker run -d --name surat-dapen-ppip-fe \
              -v $PROJECT_DIR:/app \
              -w /app \
              -p 3000:3000 \
              node:20-alpine \
              sh -c "npm install --omit=dev && npm run start"
          EOF
